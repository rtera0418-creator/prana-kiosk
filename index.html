<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>studio PRANA 受付</title>
<!--
  studio PRANA 受付（カメラ付き）
  Google の受付画面（GAS）は枠の制限でカメラが使えない。
  このページがカメラで QR を読み、埋め込んだ受付画面に会員番号だけを送る。
  受付の処理・ログイン・二重入室の防止はすべて受付画面側のまま。
-->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #2b0d0d; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #cam {
    position: fixed; z-index: 10; width: 200px;
    background: #000; border-radius: 14px; overflow: hidden;
    border: 4px solid rgba(255,255,255,.85); box-shadow: 0 4px 16px rgba(0,0,0,.35);
    transition: border-color .15s;
  }
  #cam.pos-tr { top: 12px; right: 12px; }
  #cam.pos-tl { top: 12px; left: 12px; }
  #cam.pos-br { bottom: 12px; right: 12px; }
  #cam.pos-bl { bottom: 12px; left: 12px; }
  #cam.hit { border-color: #2ecc71; }
  #reader { width: 100%; min-height: 120px; }
  #reader video { width: 100%; height: 150px; object-fit: cover; display: block; }
  #cam.front #reader video { transform: scaleX(-1); }
  #bar { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,.6); }
  #bar button {
    flex: 1; font-size: 12px; padding: 6px 2px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,.9); color: #333;
  }
  #tip { display: none; background: #2ecc71; color: #fff; font-size: 13px; font-weight: bold; padding: 4px 8px; }
  #msg { color: #fff; font-size: 12px; padding: 6px 8px; display: none; line-height: 1.4; }
  #msg button { margin-top: 6px; width: 100%; font-size: 14px; padding: 8px; border: 0; border-radius: 8px; }
  #btnFlipMini { display: none; }
  /* 受付画面の枠の中に重ねるとき（受付画面が枠の位置を知らせてくる） */
  #cam.docked { border: 0; border-radius: 20px; box-shadow: none; }
  #cam.docked #reader { position: absolute; inset: 0; min-height: 0; }
  #cam.docked #reader video { height: 100%; }
  #cam.docked #bar { display: none; }
  #cam.docked #tip { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 16px; padding: 8px; }
  #cam.docked #msg { position: absolute; left: 10px; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.7); border-radius: 12px; font-size: 14px; }
  #cam.docked #btnFlipMini {
    display: block; position: absolute; top: 8px; right: 8px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; line-height: 40px; padding: 0;
  }
  #cam.docked.hit::after {
    content: ''; position: absolute; inset: 0; border: 6px solid #2ecc71; border-radius: 20px; pointer-events: none;
  }
  #cam.hidden { visibility: hidden; }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyiOjrSAHYsS3WIfSeBjgNs94p2wznxBJQEMdQ4vnoD517w7LT0lQHh3OMTJ9PZEYU7/exec?page=reception"></iframe>

<div id="cam" class="pos-tr">
  <div id="reader"></div>
  <div id="tip"></div>
  <div id="msg"></div>
  <button type="button" id="btnFlipMini" aria-label="カメラ切替">⟲</button>
  <div id="bar">
    <button type="button" id="btnFlip">カメラ切替</button>
    <button type="button" id="btnMove">位置</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var POSITIONS = ['pos-tr', 'pos-tl', 'pos-bl', 'pos-br'];
  var SAME_CODE_GAP_MS = 3000; // 同じQRは、いったん写らなくなって3秒たつまで送らない

  function load(key, def) { try { return localStorage.getItem(key) || def; } catch (e) { return def; } }
  function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  var cam = document.getElementById('cam');
  var msg = document.getElementById('msg');
  var facing = load('prana_kiosk_facing', 'user');      // 受付 iPad は前のカメラ。スマホなら切替で後ろ
  var pos = load('prana_kiosk_pos', 'pos-tr');
  if (POSITIONS.indexOf(pos) === -1) pos = 'pos-tr';
  cam.className = pos;

  var stream = null;
  var running = false;
  var starting = false;
  var video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('autoplay', '');
  video.muted = true;
  document.getElementById('reader').appendChild(video);
  // 読み取りは表示サイズではなくカメラの元の画質で行う（表示は小さくても細かいQRが読める）
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var MAX_SIDE = 960;
  var SCAN_INTERVAL_MS = 120;
  var lastCode = '';
  var lastSeenAt = 0;
  // 受付の時間を測る（2026-11-05）：QRを探す1回あたりの時間（直近20回の平均 ms）を受付画面へ一緒に送る
  var decodeTimes = [];
  function avgDecodeMs() {
    if (decodeTimes.length === 0) return undefined;
    var sum = 0;
    for (var i = 0; i < decodeTimes.length; i++) sum += decodeTimes[i];
    return Math.round(sum / decodeTimes.length);
  }

  // 受付画面は Google の枠の中にさらに枠がある。全部の枠に送り、受付画面側が送り元を確かめて受け取る
  function sendToFrames(w, data) {
    for (var i = 0; i < w.frames.length; i++) {
      try { w.frames[i].postMessage(data, '*'); } catch (e) {}
      try { sendToFrames(w.frames[i], data); } catch (e) {}
    }
  }

  function onCode(text) {
    var code = String(text || '').trim();
    // カード裏面の予約ページQR（…/exec?page=reserve&id=STU…）なら会員番号だけ取り出す
    if (/^https:\/\/script\.google\.com\//.test(code) && /[?&]page=reserve(&|$)/.test(code)) {
      var m = code.match(/[?&]id=([^&#]+)/);
      if (m) {
        try { code = decodeURIComponent(m[1]); } catch (e) { code = m[1]; }
        if (!/^[A-Za-z0-9_-]{1,40}$/.test(code)) return;
      }
    }
    if (!code) return;
    var now = Date.now();
    if (code === lastCode && now - lastSeenAt < SAME_CODE_GAP_MS) { lastSeenAt = now; return; }
    lastCode = code;
    lastSeenAt = now;
    sendToFrames(window, { type: 'prana-qr', code: code, decodeMs: avgDecodeMs() });
    cam.classList.add('hit');
    // 読めたことを映像の上に出す（「読めていない」のか「受付画面に届いていない」のかを見分けるため）
    var tip = document.getElementById('tip');
    tip.textContent = '読み取り: ' + code.slice(0, 20);
    tip.style.display = 'block';
    setTimeout(function () { cam.classList.remove('hit'); }, 600);
    setTimeout(function () { tip.style.display = 'none'; }, 2000);
  }

  function showMsg(text, withButton) {
    msg.style.display = 'block';
    msg.innerHTML = '';
    msg.appendChild(document.createTextNode(text));
    if (withButton) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'カメラを開始';
      b.onclick = function () { start(); };
      msg.appendChild(b);
    }
  }
  function hideMsg() { msg.style.display = 'none'; }

  function scanLoop() {
    if (!running) return;
    try {
      var w = video.videoWidth, h = video.videoHeight;
      if (w && h && video.readyState >= 2) {
        var k = Math.min(1, MAX_SIDE / Math.max(w, h));
        var cw = Math.round(w * k), ch = Math.round(h * k);
        if (canvas.width !== cw) canvas.width = cw;
        if (canvas.height !== ch) canvas.height = ch;
        var t0 = Date.now();
        ctx.drawImage(video, 0, 0, cw, ch);
        var img = ctx.getImageData(0, 0, cw, ch);
        var res = jsQR(img.data, cw, ch, { inversionAttempts: 'dontInvert' });
        decodeTimes.push(Date.now() - t0);
        if (decodeTimes.length > 20) decodeTimes.shift();
        if (res && res.data) onCode(res.data);
      }
    } catch (e) {}
    setTimeout(scanLoop, SCAN_INTERVAL_MS);
  }

  function start() {
    if (typeof jsQR === 'undefined') { showMsg('読み取りの部品を読み込めませんでした。再読み込みしてください', false); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showMsg('この端末ではカメラを使えません', false); return; }
    if (running || starting) return;
    starting = true;
    hideMsg();
    cam.classList.toggle('front', facing === 'user');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(function (s) {
      stream = s;
      video.srcObject = s;
      return video.play();
    }).then(function () {
      starting = false;
      running = true;
      scanLoop();
    }).catch(function () {
      starting = false;
      stop();
      showMsg('カメラを使えませんでした。カメラを許可してから押してください', true);
    });
  }

  function stop() {
    running = false;
    if (stream) {
      stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      stream = null;
    }
    video.srcObject = null;
    return Promise.resolve();
  }

  function flipCamera() {
    facing = (facing === 'user') ? 'environment' : 'user';
    save('prana_kiosk_facing', facing);
    stop().then(start);
  }
  document.getElementById('btnFlip').onclick = flipCamera;
  document.getElementById('btnFlipMini').onclick = flipCamera;
  document.getElementById('btnMove').onclick = function () {
    pos = POSITIONS[(POSITIONS.indexOf(pos) + 1) % POSITIONS.length];
    save('prana_kiosk_pos', pos);
    POSITIONS.forEach(function (p) { cam.classList.remove(p); });
    cam.classList.add(pos);
  };

  // 受付画面に「カメラ付きで開いている」ことを知らせる（案内文の切り替え用）。枠の読み込みが遅いので数回送る
  function hello() { sendToFrames(window, { type: 'prana-kiosk-hello' }); }
  setInterval(hello, 3000);
  document.getElementById('app').addEventListener('load', hello);

  // 受付画面が「枠の位置」を知らせてきたら、カメラ映像をその枠の中に重ねる。
  //   知らせが来ない（古い受付画面）ときは今までどおり隅に浮かせる。幅0はログイン前・結果画面 → 隠す（読み取りは続ける）
  var app = document.getElementById('app');
  var GAS_FRAME_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  function isOurFrame(src) {
    function walk(w) {
      if (w === src) return true;
      for (var i = 0; i < w.frames.length; i++) {
        try { if (walk(w.frames[i])) return true; } catch (e) {}
      }
      return false;
    }
    try { return walk(app.contentWindow); } catch (e) { return false; }
  }
  function num(v) { return typeof v === 'number' && isFinite(v) ? v : NaN; }
  window.addEventListener('message', function (ev) {
    if (!GAS_FRAME_ORIGIN.test(ev.origin) || !isOurFrame(ev.source)) return;
    var d = ev.data;
    if (!d || typeof d !== 'object' || d.type !== 'prana-kiosk-rect') return;
    var x = num(d.x), y = num(d.y), w = num(d.w), h = num(d.h), vw = num(d.vw), vh = num(d.vh);
    if ([x, y, w, h, vw, vh].some(isNaN)) return;
    if (w < 40 || h < 40) {
      cam.classList.add('docked', 'hidden');
      return;
    }
    var sx = vw > 0 ? window.innerWidth / vw : 1;
    var sy = vh > 0 ? window.innerHeight / vh : 1;
    cam.classList.add('docked');
    cam.classList.remove('hidden');
    cam.style.left = Math.round(x * sx) + 'px';
    cam.style.top = Math.round(y * sy) + 'px';
    cam.style.width = Math.round(w * sx) + 'px';
    cam.style.height = Math.round(h * sy) + 'px';
    cam.style.right = 'auto';
    cam.style.bottom = 'auto';
  });

  // 画面を消して戻ったときにカメラが止まっていたら付け直す
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !running) start();
  });

  start();
})();
</script>
</body>
</html>
